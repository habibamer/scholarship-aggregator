<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Aggregator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="lang-switch-box">
            <span class="translate-icon">文A</span>
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="ar">العربية</option>
                <option value="ru">Русский</option>
                <option value="es">Español</option>
            </select>
        </div>

        <header>
            <h1 data-i18n="title">Scholarship Directory</h1>
            <p data-i18n="subtitle">Find fully funded bachelor, master, and PhD opportunities worldwide.</p>
            <span class="author"><span data-i18n="by">By</span>: <strong>Habib Amer</strong></span>
        </header>

        <section class="filter">
            <div class="field">
                <label for="kw" data-i18n="searchLabel">Search Title:</label>
                <input type="text" id="kw" data-i18n-ph="ph" placeholder="e.g. Miami, Yale, Harvard..." onkeyup="if(event.key==='Enter') runFilter()">
            </div>

            <div class="field">
                <label for="degree" data-i18n="degreeLabel">Degree:</label>
                <select id="degree">
                    <option value="all" data-i18n="allDegrees">All Degrees</option>
                    <option value="bachelor" data-i18n="bachelor">Bachelor</option>
                    <option value="master" data-i18n="master">Master</option>
                    <option value="phd" data-i18n="phd">PhD</option>
                </select>
            </div>

            <div class="field">
                <label for="country" data-i18n="countryLabel">Country:</label>
                <select id="country">
                    <option value="all" data-i18n="allCountries">All Countries</option>
                </select>
            </div>

            <button id="btn" onclick="runFilter()" data-i18n="searchBtn">Search</button>
        </section>

        <section class="table-section">
            <table id="scholarshipTable">
                <thead>
                    <tr>
                        <th data-i18n="thDegree">Degree</th>
                        <th class="title-col" data-i18n="thTitle">Scholarship Title</th>
                        <th data-i18n="thCountry">Country</th>
                        <th data-i18n="thAction">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </section>

        <footer>
            <p><span data-i18n="footerText">Developed by Habib Amer</span> &copy; 2026</p>
            <p><span data-i18n="lastUpdated">Last updated</span>: <span id="lastUpdated">-</span></p>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
