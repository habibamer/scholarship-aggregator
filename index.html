<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Aggregator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Scholarship Directory</h1>
            <p>Find fully funded bachelor, master, and PhD opportunities worldwide.</p>
            <span class="author">By: <strong>Habib Amer</strong></span>
        </header>

        <section class="filter">
            <div class="field">
                <label for="degree">Degree:</label>
                <select id="degree">
                    <option value="all">All Degrees</option>
                    <option value="bachelor">Bachelor</option>
                    <option value="master">Master</option>
                    <option value="phd">PhD</option>
                </select>
            </div>

            <div class="field">
                <label for="country">Country:</label>
                <select id="country">
                    <option value="all">All Countries</option>
                </select>
            </div>

            <button id="btn" onclick="runFilter()">Search</button>
        </section>

        <section class="table-section">
            <table id="scholarshipTable">
                <thead>
                    <tr>
                        <th>Degree</th>
                        <th class="title-col">Scholarship Title</th>
                        <th>Country</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data inserted via JS -->
                </tbody>
            </table>
        </section>

        <footer>
            <p>Developed by Habib Amer &copy; 2026</p>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
